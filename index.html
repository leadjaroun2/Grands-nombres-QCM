<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Grands Nombres en Français - A1/A2</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #003057; /* Bleu Marine Management */
            --accent: #00A9CE; /* Bleu Azur */
            --success: #27AE60;
            --error: #E74C3C;
            --bg: #F8FAFC;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #E2E8F0;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .quiz-card {
            background: white;
            width: 95%;
            max-width: 800px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            padding: 40px;
            box-sizing: border-box;
        }

        /* Barre de progression */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .progress-container {
            flex-grow: 1;
            height: 8px;
            background: #EDF2F7;
            border-radius: 4px;
            margin: 0 20px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, var(--primary), var(--accent));
            width: 0%;
            transition: width 0.4s ease;
        }

        /* Zone Question */
        h1 {
            font-family: 'Playfair Display', serif;
            color: var(--primary);
            font-size: 28px;
            margin: 0 0 20px 0;
        }

        .question-box {
            background: var(--bg);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 25px;
            border-left: 6px solid var(--primary);
        }

        .question-text {
            font-size: 20px;
            font-weight: 600;
            color: #1E293B;
            margin-bottom: 5px;
        }

        /* Boutons */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr;
            }
        }

        .option-btn {
            background: white;
            border: 2px solid #E2E8F0;
            padding: 18px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent);
            background: #F0F9FF;
        }

        .option-btn.correct {
            background-color: #D1FAE5;
            border-color: var(--success);
            color: #065F46;
        }

        .option-btn.incorrect {
            background-color: #FEE2E2;
            border-color: var(--error);
            color: #991B1B;
        }

        /* Feedback */
        .feedback {
            margin-top: 25px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 700;
            display: none;
        }

        .next-btn {
            width: 100%;
            background: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            display: none;
        }

        .next-btn:hover { 
            background: #002340;
        }

        /* Ecran Final */
        #result-screen { 
            text-align: center;
            display: none; 
        }
        .score-big { 
            font-size: 64px; 
            color: var(--primary); 
            font-weight: 800;
            margin: 20px 0; 
        }
    </style>
</head>
<body>

<div class="quiz-card">
    <div id="quiz-ui">
        <div class="header">
            <span id="q-count" style="font-weight: 600; color: #64748B;">Question 1/20</span>
            <div class="progress-container">
                <div class="progress-bar" id="p-bar"></div>
            </div>
            <span id="score-count" style="font-weight: 600; color: var(--primary);">Score: 0</span>
        </div>

        <h1>Les Grands Nombres en Français</h1>
        
        <div class="question-box">
            <div class="question-text" id="q-text">Chargement...</div>
        </div>

        <div class="options-grid" id="options"></div>
        <div class="feedback" id="feedback"></div>
        <button class="next-btn" id="next-btn" onclick="nextQuestion()">Question suivante →</button>
    </div>

    <div id="result-screen">
        <h1 id="res-title">Quiz Terminé !</h1>
        <div class="score-big" id="final-score">0 / 20</div>
        <p id="res-comment" style="font-size: 18px; margin-bottom: 30px;"></p>
        <button class="next-btn" style="display:block;" onclick="location.reload()">Recommencer / Restart</button>
    </div>
</div>

<script>
    // Banque complète de 40 questions sur les grands nombres (1 000 à 1 000 000 000)
    const allQuestions = [
        { q: "Comment écrit-on le nombre 1 250 ?", o: ["mille-deux-cent-cinquante", "un-mille-deux-cents-cinquante", "mille-deux-cents-cinquante", "milles-deux-cent-cinquante"], a: 0 },
        { q: "Comment écrit-on le nombre 3 000 ?", o: ["trois-mille", "trois-milles", "trois-cent-mille", "trente-cents"], a: 0 },
        { q: "Comment écrit-on le nombre 5 800 ?", o: ["cinq-mille-huit-cents", "cinq-mille-huit-cent", "cinq-milles-huit-cents", "cinquante-huit-cents"], a: 0 },
        { q: "Comment écrit-on le nombre 10 000 ?", o: ["dix-mille", "dix-milles", "un-dix-mille", "cent-mille"], a: 0 },
        { q: "Comment écrit-on le nombre 21 000 ?", o: ["vingt-et-un-mille", "vingt-un-mille", "vingt-et-un-milles", "vingt-deux-mille"], a: 0 },
        { q: "Comment écrit-on le nombre 75 320 ?", o: ["soixante-quinze-mille-trois-cent-vingt", "soixante-quinze-mille-trois-cents-vingt", "septante-cinq-mille-trois-cent-vingt", "soixante-quinze-milles-trois-cent-vingt"], a: 0 },
        { q: "Comment écrit-on le nombre 80 000 ?", o: ["quatre-vingt-mille", "quatre-vingts-mille", "quatre-vingt-milles", "huit-gros-mille"], a: 0 },
        { q: "Comment écrit-on le nombre 91 400 ?", o: ["quatre-vingt-onze-mille-quatre-cents", "quatre-vingt-onze-mille-quatre-cent", "quatre-vingt-dix-et-un-mille-quatre-cents", "nonante-et-un-mille-quatre-cents"], a: 0 },
        { q: "Comment écrit-on le nombre 100 000 ?", o: ["cent-mille", "cents-mille", "un-cent-mille", "cent-milles"], a: 0 },
        { q: "Comment écrit-on le nombre 200 046 ?", o: ["deux-cent-mille-quarante-six", "deux-cents-mille-quarante-six", "deux-cent-milles-quarante-six", "deux-cents-milles-quarante-six"], a: 0 },
        { q: "Comment écrit-on le nombre 450 000 ?", o: ["quatre-cent-cinquante-mille", "quatre-cents-cinquante-mille", "quatre-cent-cinquante-milles", "quarante-cinq-cent-mille"], a: 0 },
        { q: "Comment écrit-on le nombre 800 000 ?", o: ["huit-cent-mille", "huit-cents-mille", "huit-cent-milles", "quatre-vingt-mille"], a: 0 },
        { q: "Comment écrit-on le nombre 1 000 000 ?", o: ["un-million", "un-millions", "mille-mille", "un-milliard"], a: 0 },
        { q: "Comment écrit-on le nombre 2 000 000 ?", o: ["deux-millions", "deux-million", "deux-milliards", "deux-milles-millions"], a: 0 },
        { q: "Comment écrit-on le nombre 5 500 000 ?", o: ["cinq-millions-cinq-cent-mille", "cinq-million-cinq-cents-mille", "cinq-millions-cinq-cents-mille", "cinq-milles-millions-cinq-cent-mille"], a: 0 },
        { q: "Comment écrit-on le nombre 80 * 1 000 000 (80 000 000) ?", o: ["quatre-vingts-millions", "quatre-vingt-millions", "quatre-vingts-million", "quatre-vingt-million"], a: 0 },
        { q: "Comment écrit-on le nombre 100 000 000 ?", o: ["cent-millions", "cent-million", "cents-millions", "un-cent-million"], a: 0 },
        { q: "Comment écrit-on le nombre 250 000 000 ?", o: ["deux-cent-cinquante-millions", "deux-cents-cinquante-millions", "deux-cent-cinquante-million", "deux-cents-cinquante-million"], a: 0 },
        { q: "Comment écrit-on le nombre 1 000 000 000 ?", o: ["un-milliard", "un-milliards", "mille-millions", "un-million"], a: 0 },
        { q: "Comment écrit-on le nombre 3 000 000 000 ?", o: ["trois-milliards", "trois-milliard", "trente-milliards", "trois-millions"], a: 0 },
        { q: "Quel chiffre correspond à : « quatre-mille-trente » ?", o: ["4 030", "4 300", "40 030", "4 003"], a: 0 },
        { q: "Quel chiffre correspond à : « douze-mille-cinq-cents » ?", o: ["12 500", "12 500 000", "120 500", "2 500"], a: 0 },
        { q: "Quel chiffre correspond à : « trente-quatre-mille-six-cent-huit » ?", o: ["34 608", "34 680", "34 068", "304 608"], a: 0 },
        { q: "Quel chiffre correspond à : « soixante-et-un-mille » ?", o: ["61 000", "71 000", "601 000", "16 000"], a: 0 },
        { q: "Quel chiffre correspond à : « quatre-vingt-six-mille-deux-cents » ?", o: ["86 200", "86 202", "96 200", "80 620"], a: 0 },
        { q: "Quel chiffre correspond à : « quatre-vingt-dix-mille » ?", o: ["90 000", "80 000", "900 000", "70 000"], a: 0 },
        { q: "Quel chiffre correspond à : « cent-vingt-mille » ?", o: ["120 000", "100 200", "120", "1 200 000"], a: 0 },
        { q: "Quel chiffre correspond à : « trois-cent-quatre-vingt-mille » ?", o: ["380 000", "300 800", "380", "3 800 000"], a: 0 },
        { q: "Quel chiffre correspond à : « sept-cent-cinquante-mille-huit-cent-quatre-vingts » ?", o: ["750 880", "750 800", "705 880", "758 080"], a: 0 },
        { q: "Quel chiffre correspond à : « neuf-cent-quatre-vingt-dix-neuf-mille » ?", o: ["999 000", "899 000", "919 000", "990 019"], a: 0 },
        { q: "Quel chiffre correspond à : « quatre-millions » ?", o: ["4 000 000", "4 000", "400 000", "4 000 000 000"], a: 0 },
        { q: "Quel chiffre correspond à : « dix-millions-deux-cent-mille » ?", o: ["10 200 000", "10 002 000", "10 200", "100 200 000"], a: 0 },
        { q: "Quel chiffre correspond à : « quarante-cinq-millions » ?", o: ["45 000 000", "450 000", "45 000", "4 500 000"], a: 0 },
        { q: "Quel chiffre correspond à : « quatre-vingts-millions » ?", o: ["80 000 000", "80 000", "800 000", "8 000 000"], a: 0 },
        { q: "Quel chiffre correspond à : « deux-cents-millions » ?", o: ["200 000 000", "200 000", "2 000 000", "20 000 000"], a: 0 },
        { q: "Quel chiffre correspond à : « cinq-cent-cinquante-millions » ?", o: ["550 000 000", "505 000 000", "55 000 000", "550 000"], a: 0 },
        { q: "Quel chiffre correspond à : « neuf-cent-quatre-vingt-dix-millions » ?", o: ["990 000 000", "890 000 000", "919 000 000", "990 000"], a: 0 },
        { q: "Quel chiffre correspond à : « cinq-milliards » ?", o: ["5 000 000 000", "5 000 000", "500 000 000", "5 000"], a: 0 },
        { q: "Quel chiffre correspond à : « quarante-milliards » ?", o: ["40 000 000 000", "40 000 000", "400 000 000", "4 000 000 000"], a: 0 },
        { q: "Quel chiffre correspond à : « cent-milliards » ?", o: ["100 000 000 000", "100 000 000", "100 000", "1 000 000 000"], a: 0 }
    ];

    let quizQuestions = [];
    let currentIdx = 0;
    let score = 0;

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function initQuiz() {
        let pool = JSON.parse(JSON.stringify(allQuestions));
        shuffleArray(pool); 
        quizQuestions = pool.slice(0, 20); // Sélectionne 20 questions aléatoires parmi les 40
        currentIdx = 0;
        score = 0;
        loadQ();
    }

    function loadQ() {
        const qData = quizQuestions[currentIdx];
        document.getElementById('q-text').innerText = qData.q;
        document.getElementById('q-count').innerText = `Question ${currentIdx + 1}/20`;
        document.getElementById('p-bar').style.width = ((currentIdx + 1) / 20 * 100) + "%";
        
        const correctText = qData.o[qData.a];
        
        let optionsMapped = qData.o.map((opt, index) => {
            return { text: opt, isCorrect: index === qData.a };
        });
        
        shuffleArray(optionsMapped);

        const optCont = document.getElementById('options');
        optCont.innerHTML = '';
        
        optionsMapped.forEach((opt) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerText = opt.text;
            btn.onclick = () => check(opt.isCorrect, btn, correctText);
            optCont.appendChild(btn);
        });
        
        document.getElementById('feedback').style.display = 'none';
        document.getElementById('next-btn').style.display = 'none';
    }

    function check(isCorrect, btn, correctText) {
        const all = document.querySelectorAll('.option-btn');
        all.forEach(b => b.disabled = true);

        const f = document.getElementById('feedback');
        f.style.display = 'block';

        if(isCorrect) {
            btn.classList.add('correct');
            f.innerText = "Excellent ! Correct. ✅";
            f.style.color = "var(--success)";
            score++;
            document.getElementById('score-count').innerText = "Score: " + score;
        } else {
            btn.classList.add('incorrect');
            all.forEach(b => {
                if(b.innerText === correctText) b.classList.add('correct');
            });
            f.innerText = "Dommage ! La réponse était : " + correctText + " ❌";
            f.style.color = "var(--error)";
        }
        document.getElementById('next-btn').style.display = 'block';
    }

    function nextQuestion() {
        currentIdx++;
        if(currentIdx < 20) loadQ();
        else showRes();
    }

    function showRes() {
        document.getElementById('quiz-ui').style.display = 'none';
        document.getElementById('result-screen').style.display = 'block';
        document.getElementById('final-score').innerText = score + " / 20";
        const comm = document.getElementById('res-comment');
        
        if(score === 20) comm.innerHTML = "Parfait ! Les grands nombres en français n'ont plus aucun secret pour vous.<br><i>Perfect! Large French numbers hold no secrets for you.</i>";
        else if(score >= 14) comm.innerHTML = "Très bien ! Vous maîtrisez bien la structure des millions et des milliards.<br><i>Great! You have a good command of millions and billions structures.</i>";
        else comm.innerHTML = "Continuez de réviser la structure et l'orthographe des grands nombres !<br><i>Keep reviewing the structure and spelling of large numbers!</i>";
    }

    initQuiz();
</script>

</body>
</html>
